org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The server this build points at by default. Overridable per build without touching source:
#   ./gradlew assembleDebug -PmootifyServerUrl=http://192.168.1.50:5199
# It is only the value the login screen starts with — the app stores whatever it signs in against.
mootifyServerUrl=https://moo.lazy.kiwi

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
